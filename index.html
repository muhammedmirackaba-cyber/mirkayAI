<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI | Official</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* ARKA PLAN KURT LOGOSU */
        .wolf-bg { 
            position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); 
            width: 260px; opacity: 0.1; z-index: 0; pointer-events: none; 
        }

        /* ÜST BAR */
        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #eee; background: #fff; z-index: 1000; }
        .hamburger, .profile-btn { font-size: 26px; cursor: pointer; padding: 5px; color: #000; }

        /* YAN MENÜLER */
        .side-panel { position: fixed; top: 0; width: 280px; height: 100%; transition: 0.3s ease; z-index: 2000; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        #side-menu { left: -290px; background: #000; color: #fff; }
        #side-menu.active { left: 0; }
        #profile-menu { right: -290px; background: #fff; color: #000; border-left: 1px solid #eee; }
        #profile-menu.active { right: 0; }
        .panel-header { padding: 20px; font-weight: bold; border-bottom: 1px solid rgba(128,128,128,0.2); display: flex; justify-content: space-between; align-items: center; }
        .close-btn { cursor: pointer; font-size: 24px; }

        /* MESAJ ALANI */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; z-index: 5; }
        .msg { padding: 12px 16px; border-radius: 18px; margin: 5px 0; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 4px; }
        .ai-msg { align-self: flex-start; background: #f0f0f0; border: 1px solid #eee; border-bottom-left-radius: 4px; }

        /* GİRİŞ ALANI */
        .input-wrapper { padding: 10px 15px 25px; background: #fff; border-top: 1px solid #eee; z-index: 1000; }
        #chat-form { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; font-size: 16px; outline: none; }
        .send-btn { width: 45px; height: 45px; background: #000; color: #fff; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .btn-m { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1500; display: none; }
    </style>
</head>
<body>

    <div id="overlay" onclick="closeAllMenus()"></div>
    
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray_wolf_head_silhouette.svg/1024px-Gray_wolf_head_silhouette.svg.png" 
         class="wolf-bg" onerror="this.style.display='none'">

    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu('side-menu')">☰</div>
        <strong style="letter-spacing: 1px;">MİRKAY AI</strong>
        <div class="profile-btn" onclick="toggleMenu('profile-menu')">👤</div>
    </div>

    <div id="side-menu" class="side-panel">
        <div class="panel-header">Menü <span class="close-btn" onclick="closeAllMenus()">×</span></div>
        <div style="padding: 10px;">
            <button class="btn-m" style="background:#28a745; color:#fff;" onclick="window.open('https://play.google.com/store/apps/details?id=com.mirkayai.app', '_blank')">📥 Uygulamayı İndir</button>
        </div>
        <div id="history-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
        <div style="padding:15px; border-top:1px solid #333;">
            <button class="btn-m" style="background:#fff; color:#000;" onclick="yeniSohbet()">+ Yeni Sohbet</button>
            <button class="btn-m" style="background:#ff4d4d; color:#fff;" onclick="gecmisiSil()">🗑️ Sohbeti Sil</button>
        </div>
    </div>

    <div id="profile-menu" class="side-panel">
        <div class="panel-header">Hesabım <span class="close-btn" onclick="closeAllMenus()">×</span></div>
        <div style="padding:20px;">
            <p id="status-info" style="color:#666; font-size:14px; white-space: pre-line;"></p>
            <button class="btn-m" style="background:#FFD700; color:#000;">🏆 Premium Al</button>
            <button class="btn-m" style="background:#f0f0f0; border:1px solid #ddd;" onclick="location.reload()">Çıkış Yap</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <form id="chat-form" onsubmit="event.preventDefault(); mesajGonder();">
            <input type="text" id="user-input" placeholder="Mirkay AI'a sor..." autocomplete="off">
            <button type="submit" class="send-btn">🚀</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
