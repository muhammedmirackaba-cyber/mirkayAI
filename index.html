<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MİRKAY AI - Giriş</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .background-bozkurt { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('icon.png'); background-size: contain; background-position: center; background-repeat: no-repeat; opacity: 0.12; filter: blur(3px); z-index: -1; }
        .login-container { background-color: rgba(15, 15, 15, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.2); width: 340px; text-align: center; border: 1px solid #222; }
        h2 { margin-bottom: 25px; letter-spacing: 3px; color: #eee; text-transform: uppercase; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: #ff0000; outline: none; box-shadow: 0 0 10px rgba(255, 0, 0, 0.1); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 12px; transition: 0.3s; }
        .btn-primary { background: #ff0000; color: #fff; text-transform: uppercase; }
        .btn-primary:hover { background: #cc0000; transform: translateY(-2px); }
        .btn-secondary { background: #222; color: #bbb; font-size: 13px; border: 1px solid #333; }
        .btn-secondary:hover { background: #333; color: #fff; }
        #error-message { color: #ff4444; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="background-bozkurt"></div>
    <div class="login-container">
        <h2>MİRKAY AI</h2>
        <input type="email" id="email" placeholder="E-Posta Adresi">
        <input type="password" id="password" placeholder="Şifre">
        <button class="btn btn-primary" id="login-btn">GİRİŞ YAP</button>
        <button class="btn btn-secondary" id="register-btn">YENİ KAYIT (E-POSTA ONAYLI)</button>
        <div id="error-message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
