<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI</title>
    <style>
        /* MOBİL UYGULAMA AYARLARI */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .wolf-bg { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 250px; opacity: 0.05; z-index: -1; pointer-events: none; }
        
        /* Üst Bar (iOS/Android Style) */
        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #fff; border-bottom: 1px solid #f0f0f0; z-index: 1000; flex-shrink: 0; }
        .hamburger, .profile-btn { font-size: 22px; cursor: pointer; padding: 10px; }

        /* Yan Menüler */
        .side-panel { position: fixed; top: 0; width: 80%; max-width: 300px; height: 100%; background: #fff; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        #side-menu { left: -300px; background: #000; color: #fff; }
        #side-menu.active { left: 0; }
        #profile-menu { right: -300px; }
        #profile-menu.active { right: 0; }
        
        .menu-header { padding: 20px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }

        /* Sohbet Listesi */
        .menu-item { padding: 15px; margin: 10px; border-radius: 12px; background: #111; border: 1px solid #222; font-size: 14px; }

        /* Mesaj Alanı (Kaydırılabilir) */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .msg { padding: 12px 16px; border-radius: 18px; margin: 4px 0; max-width: 85%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 4px; }
        .ai-msg { align-self: flex-start; background: #f0f0f0; color: #000; border-bottom-left-radius: 4px; border: 1px solid #eee; }

        /* Alt Giriş Alanı (Klavye Dostu) */
        .input-wrapper { padding: 10px 15px 25px; background: #fff; border-top: 1px solid #f0f0f0; display: flex; gap: 8px; align-items: center; }
        input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 16px; background: #f9f9f9; }
        .send-btn { width: 45px; height: 45px; background: #000; color: #fff; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Auth Screen */
        #auth-overlay { position: fixed; inset: 0; background: #fff; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { width: 100%; max-width: 320px; text-align: center; }
        .auth-box input { width: 100%; margin: 8px 0; }
        .hidden { display: none !important; }
        
        /* Modern Butonlar */
        .btn-action { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin: 5px 0; cursor: pointer; }
        .bg-gold { background: #FFD700; color: #000; }
        .bg-red { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray_wolf_head_silhouette.svg/1024px-Gray_wolf_head_silhouette.svg.png" class="wolf-bg">

    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu('side-menu')">☰</div>
        <strong style="letter-spacing: 1px;">MİRKAY AI</strong>
        <div class="profile-btn" onclick="toggleMenu('profile-menu')">👤</div>
    </div>

    <div id="side-menu" class="side-panel">
        <div class="menu-header">Geçmiş Sohbetler <span onclick="toggleMenu('side-menu')">×</span></div>
        <div id="history-list"></div>
    </div>

    <div id="profile-menu" class="side-panel">
        <div class="menu-header" style="color:#000;">Profil Ayarları <span onclick="toggleMenu('profile-menu')">×</span></div>
        <div style="padding: 20px; text-align: center; color: #000;">
            <p id="user-display-name" style="font-size: 18px; font-weight: bold; margin-bottom: 5px;"></p>
            <p id="display-status" style="font-size: 14px; color: #666;"></p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <button class="btn-action" style="border: 1px solid #000; background: #fff;" onclick="emailBagla()">E-posta Bağla</button>
            <button class="btn-action bg-gold" onclick="alert('Yakında!')">Premium'a Geç</button>
            <button class="btn-action bg-red" onclick="cikisYap()">Çıkış Yap</button>
        </div>
    </div>

    <div id="auth-overlay" class="hidden">
        <div class="auth-box">
            <h1 style="margin-bottom: 30px;">🐺</h1>
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-password" placeholder="Şifre">
            <button class="btn-action" style="background:#000; color:#fff; margin-top:10px;" onclick="hizliKayit()">Başlat</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <input type="text" id="user-input" placeholder="Mesajını yaz..." autocomplete="off">
        <button class="send-btn" onclick="mesajGonder()">🚀</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
