<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Bozkurt Arka Plan */
        .wolf-bg { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 250px; opacity: 0.08; z-index: -1; pointer-events: none; }
        
        /* Üst Bar */
        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #fff; border-bottom: 1px solid #eee; z-index: 1000; }
        .hamburger, .profile-btn { font-size: 24px; cursor: pointer; padding: 5px; }

        /* Sol Menü (Geçmiş ve Silme) */
        .side-panel { position: fixed; top: 0; width: 85%; max-width: 320px; height: 100%; background: #000; color: #fff; transition: 0.3s; z-index: 2000; display: flex; flex-direction: column; }
        #side-menu { left: -320px; }
        #side-menu.active { left: 0; }
        .menu-header { padding: 20px; border-bottom: 1px solid #222; font-weight: bold; }
        #history-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .menu-item-wrapper { display: flex; align-items: center; background: #111; margin-bottom: 8px; border-radius: 10px; padding: 5px 10px; }
        .delete-checkbox { width: 18px; height: 18px; display: none; margin-right: 10px; accent-color: #ff4d4d; }
        .delete-checkbox.show { display: block; }

        /* Sağ Menü (Hesap) */
        #profile-menu { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: #fff; transition: 0.3s; z-index: 2000; border-left: 1px solid #eee; padding: 20px; }
        #profile-menu.active { right: 0; }

        /* Mesajlar */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { padding: 12px 16px; border-radius: 18px; margin: 4px 0; max-width: 85%; font-size: 15px; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 4px; }
        .ai-msg { align-self: flex-start; background: #f0f0f0; color: #000; border-bottom-left-radius: 4px; }

        /* Alt Giriş (Enter Fix) */
        .input-wrapper { padding: 10px 15px 25px; background: #fff; border-top: 1px solid #eee; }
        #chat-form { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; font-size: 16px; outline: none; }
        .send-btn { width: 45px; height: 45px; background: #000; color: #fff; border: none; border-radius: 50%; cursor: pointer; }

        /* Butonlar */
        .btn-m { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 8px; cursor: pointer; }
        .bg-white { background: #fff; color: #000; }
        .bg-red { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray_wolf_head_silhouette.svg/1024px-Gray_wolf_head_silhouette.svg.png" class="wolf-bg">

    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu('side-menu')">☰</div>
        <strong>MİRKAY AI</strong>
        <div class="profile-btn" onclick="toggleMenu('profile-menu')">👤</div>
    </div>

    <div id="side-menu" class="side-panel">
        <div class="menu-header">Sohbetler <span onclick="toggleMenu('side-menu')" style="float:right">×</span></div>
        <div id="history-list"></div>
        <div style="padding:15px; border-top:1px solid #222;">
            <button class="btn-m bg-white" onclick="yeniSohbet()">+ Yeni Sohbet</button>
            <button class="btn-m" style="background:#222; color:#ff4d4d;" id="del-mode-btn" onclick="silmeModunuAc()">Sohbeti Sil</button>
            <button class="btn-m bg-red" id="confirm-del-btn" style="display:none;" onclick="seciliSohbetleriSil()">Seçilenleri Sil 🗑️</button>
        </div>
    </div>

    <div id="profile-menu">
        <h3 style="color:#000">Hesap Ayarları</h3>
        <hr>
        <button class="btn-m" style="background:#FFD700; color:#000">Premium Ol</button>
        <button class="btn-m" style="border:1px solid #ddd; background:#fff;" onclick="alert('E-posta bağlama yakında!')">E-posta Bağla</button>
        <button class="btn-m bg-red" onclick="location.reload()">Çıkış Yap</button>
        <button class="btn-m" style="background:#eee;" onclick="toggleMenu('profile-menu')">Kapat</button>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <form id="chat-form" onsubmit="event.preventDefault(); mesajGonder();">
            <input type="text" id="user-input" placeholder="Mesaj yaz..." autocomplete="off">
            <button type="submit" class="send-btn">🚀</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
        // FIREBASE CONFIG (Kendi bilgilerinle doldur)
        const firebaseConfig = {
            apiKey: "AIzaSyCAO5cE2T2ShFl4v9somN8Ws6KaWlF80cU",
            authDomain: "mirkayai.firebaseapp.com",
            databaseURL: "https://mirkayai-default-rtdb.firebaseio.com",
            projectId: "mirkayai",
            storageBucket: "mirkayai.firebasestorage.app",
            messagingSenderId: "467181525936",
            appId: "1:467181525936:web:16dc00ac9f155f92ccd475"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // OTOMATİK GİRİŞ (Test için hızlı giriş)
        auth.onAuthStateChanged(user => { if(!user) auth.signInAnonymously(); else gecmisiYukle(user.uid); });

        function mesajGonder() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if (!msg) return;

            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="msg user-msg">${msg}</div>`;
            
            // Firebase Kayıt (Hata kontrolü eklendi)
            const user = auth.currentUser;
            if(user) {
                db.ref('history/' + user.uid).push({ baslik: msg.substring(0,20), tamMesaj: msg })
                .catch(e => console.error("Firebase Hatası: ", e.message));
            }

            input.value = "";
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                container.innerHTML += `<div class="msg ai-msg">Anladım Mirkay, hemen yardımcı oluyorum! 🐺</div>`;
                container.scrollTop = container.scrollHeight;
            }, 600);
        }

        function silmeModunuAc() {
            const cbs = document.querySelectorAll('.delete-checkbox');
            const btn = document.getElementById('confirm-del-btn');
            cbs.forEach(c => c.classList.toggle('show'));
            btn.style.display = btn.style.display === 'none' ? 'block' : 'none';
        }

        function seciliSohbetleriSil() {
            const selected = document.querySelectorAll('.delete-checkbox:checked');
            selected.forEach(s => db.ref('history/' + auth.currentUser.uid + '/' + s.dataset.key).remove());
            silmeModunuAc();
        }

        function gecmisiYukle(uid) {
            db.ref('history/' + uid).on('value', snap => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                snap.forEach(child => {
                    const data = child.val();
                    const item = document.createElement('div');
                    item.className = 'menu-item-wrapper';
                    item.innerHTML = `<input type="checkbox" class="delete-checkbox" data-key="${child.key}"><div style="flex:1; cursor:pointer">${data.baslik}</div>`;
                    item.onclick = () => { document.getElementById('chat-container').innerHTML = `<div class="msg user-msg">${data.tamMesaj}</div>`; toggleMenu('side-menu'); };
                    list.appendChild(item);
                });
            });
        }

        function yeniSohbet() { document.getElementById('chat-container').innerHTML = ""; toggleMenu('side-menu'); }
        function toggleMenu(id) { document.getElementById(id).classList.toggle('active'); }
    </script>
</body>
</html>
