<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI | Final 🐺</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: #f4f4f4; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #000; color: #fff; z-index: 1000; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { padding: 12px 16px; border-radius: 15px; margin: 8px 0; max-width: 85%; font-size: 15px; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: #fff; color: #333; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
        .msg img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; background: #eee; min-height: 200px; }
        .input-wrapper { padding: 15px; background: #fff; border-top: 1px solid #eee; }
        #chat-form { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; }
        input[type="text"] { flex: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 30px; }
        .send-btn { width: 45px; height: 45px; background: #000; border: none; border-radius: 50%; color: #fff; cursor: pointer; }
        .ai-btn { padding: 10px 15px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="top-bar"><strong>MİRKAY AI</strong></div>
    <div id="chat-container"></div>
    <div class="input-wrapper">
        <button class="ai-btn" onclick="fotoGrafCiz()">🎨 AI Fotoğraf Çiz</button>
        <form id="chat-form" onsubmit="event.preventDefault(); mesajAt();">
            <input type="text" id="user-input" placeholder="Bir şey yaz..." autocomplete="off">
            <button type="submit" class="send-btn">🚀</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
