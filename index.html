<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MİRKAY AI - Bozkurt Giriş</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        /* Tasarım: Arka Plan Siyah ve Bozkurt Temalı */
        body { 
            margin: 0; 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Arka plandaki flulu Bozkurt */
        .background-bozkurt { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-image: url('icon.png'); 
            background-size: contain; 
            background-position: center; 
            background-repeat: no-repeat; 
            opacity: 0.15; 
            filter: blur(4px); 
            z-index: -1; 
        }

        /* Giriş Paneli */
        .login-box { 
            background-color: rgba(15, 15, 15, 0.95); 
            padding: 45px; 
            border-radius: 20px; 
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.25); 
            width: 350px; 
            text-align: center; 
            border: 1px solid #222; 
        }

        h2 { 
            margin-bottom: 30px; 
            font-weight: bold; 
            letter-spacing: 4px; 
            color: #f0f0f0; 
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 12px; 
            color: #fff; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus { 
            border-color: #ff0000; 
            outline: none; 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.15); 
        }

        /* Butonlar */
        .btn { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            margin-bottom: 12px; 
            transition: 0.3s; 
        }

        .btn-login { 
            background: #ff0000; 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        .btn-login:hover { 
            background: #cc0000; 
            transform: scale(1.02); 
        }

        .btn-register { 
            background: #1a1a1a; 
            color: #888; 
            font-size: 13px;
            border: 1px solid #333;
        }

        .btn-register:hover { 
            background: #222; 
            color: #fff; 
        }

        #error-message { 
            color: #ff4d4d; 
            font-size: 13px; 
            margin-top: 15px; 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="background-bozkurt"></div>

    <div class="login-box">
        <h2>MİRKAY AI</h2>
        
        <input type="email" id="email" placeholder="E-Posta Adresiniz" required>
        <input type="password" id="password" placeholder="Şifreniz" required>
        
        <button class="btn btn-login" id="login-btn">SİSTEME GİRİŞ</button>
        <button class="btn btn-register" id="register-btn">YENİ BOZKURT KAYDI</button>
        
        <div id="error-message"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
