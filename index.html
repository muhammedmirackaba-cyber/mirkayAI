<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI | Kararlı Sürüm</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* KURT ARKA PLANI - GÜVENLİ LİNK */
        .wolf-bg { 
            position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); 
            width: 260px; opacity: 0.08; z-index: 0; pointer-events: none; 
        }

        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #eee; background: #fff; z-index: 1000; }
        .hamburger, .profile-btn { font-size: 26px; cursor: pointer; color: #000; }

        .side-panel { position: fixed; top: 0; width: 280px; height: 100%; transition: 0.3s ease; z-index: 2000; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        #side-menu { left: -290px; background: #000; color: #fff; }
        #side-menu.active { left: 0; }
        #profile-menu { right: -290px; background: #fff; color: #000; border-left: 1px solid #eee; }
        #profile-menu.active { right: 0; }

        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; z-index: 5; background: transparent; }
        .msg { padding: 12px 16px; border-radius: 18px; margin: 5px 0; max-width: 85%; font-size: 15px; position: relative; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 4px; }
        .ai-msg { align-self: flex-start; background: #f4f4f4; color: #333; border: 1px solid #eee; border-bottom-left-radius: 4px; }
        .chat-img { max-width: 100%; border-radius: 10px; margin: 5px 0; }

        .input-wrapper { padding: 10px 15px 25px; background: #fff; border-top: 1px solid #eee; z-index: 1000; }
        #chat-form { display: flex; align-items: center; gap: 10px; }
        .attach-btn { font-size: 24px; cursor: pointer; color: #666; }
        input[type="text"] { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 16px; }
        .send-btn { width: 45px; height: 45px; background: #000; border: none; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        #file-input { display: none; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1500; display: none; }
    </style>
</head>
<body>
    <div id="overlay" onclick="closeAllMenus()"></div>
    
    <img src="https://cdn-icons-png.flaticon.com/512/3233/3233857.png" class="wolf-bg" crossorigin="anonymous">
    
    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu('side-menu')">☰</div>
        <strong style="letter-spacing: 1px;">MİRKAY AI</strong>
        <div class="profile-btn" onclick="toggleMenu('profile-menu')">👤</div>
    </div>

    <div id="side-menu" class="side-panel">
        <div style="padding:20px; border-bottom:1px solid #333;">Menü</div>
        <div style="padding:15px;"><button onclick="location.reload()" style="width:100%; padding:10px; border-radius:8px; border:none; cursor:pointer;">+ Yeni Sohbet</button></div>
    </div>

    <div id="profile-menu" class="side-panel">
        <div style="padding:20px; border-bottom:1px solid #eee;">Profilim</div>
        <div style="padding:20px;"><p id="status-info">Statü: Yükleniyor...</p></div>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <form id="chat-form" onsubmit="event.preventDefault(); mesajGonder();">
            <label for="file-input" class="attach-btn">📎</label>
            <input type="file" id="file-input" accept="image/*" onchange="resimYukle(this)">
            <input type="text" id="user-input" placeholder="Mesaj yaz..." autocomplete="off">
            <button type="submit" class="send-btn">🚀</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
