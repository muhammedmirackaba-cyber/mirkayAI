<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI | Kararlı Sürüm 🐺</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: #f4f4f4; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Login Ekranı */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 20px; text-align: center; }
        .login-card { background: #111; padding: 30px; border-radius: 20px; border: 1px solid #333; width: 100%; max-width: 350px; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; }
        
        /* Üst Bar */
        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #000; color: #fff; z-index: 1000; }
        .hamburger, .profile-btn { font-size: 26px; cursor: pointer; background: none; border: none; color: #fff; }
        
        /* Sohbet Alanı */
        #chat-container { height: calc(100vh - 130px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; font-size: 15px; position: relative; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: #fff; color: #333; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
        .msg img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; background: #eee; min-height: 150px; }

        /* Yan Menüler */
        .side-panel { position: fixed; top: 0; width: 300px; height: 100%; transition: 0.4s; z-index: 2000; background: #fff; box-shadow: 0 0 25px rgba(0,0,0,0.2); }
        #side-menu { left: -320px; background: #111; color: #fff; display: flex; flex-direction: column; }
        #side-menu.active { left: 0; }
        #profile-menu { right: -320px; }
        #profile-menu.active { right: 0; }
        .p-header { padding: 20px; border-bottom: 1px solid #333; font-weight: bold; display: flex; justify-content: space-between; }

        /* Sohbet Özetleri Listesi */
        #summary-list { flex: 1; overflow-y: auto; padding: 15px; }
        .summary-item { background: #222; padding: 12px; border-radius: 10px; margin-bottom: 10px; position: relative; font-size: 13px; border: 1px solid #333; cursor: pointer; }
        .delete-box { position: absolute; right: 10px; top: 10px; width: 20px; height: 20px; border: 1px solid red; color: red; display: none; text-align: center; line-height: 18px; font-weight: bold; }
        .delete-mode .delete-box { display: block; }

        /* Profil Tasarımı */
        .profile-circle { width: 70px; height: 70px; background: #000; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; border: 2px solid gold; }
        
        /* Giriş ve Ataç */
        .input-wrapper { height: 70px; padding: 15px; background: #fff; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; position: relative; }
        #chat-form { flex: 1; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ddd; }
        
        #attach-menu { position: absolute; bottom: 80px; left: 15px; background: #fff; border: 1px solid #ddd; display: none; flex-direction: column; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); z-index: 2000; width: 200px; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }
        .btn-gold { background: linear-gradient(45deg, #FFD700, #FFA500); color: #000; font-weight: bold; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h2 style="color:gold">MİRKAY AI 🐺</h2>
            <input type="email" id="login-email" class="login-input" placeholder="E-posta">
            <input type="password" id="login-pass" class="login-input" placeholder="Şifre (min 6)">
            <button class="btn-gold" onclick="login()">Giriş Yap / Kayıt Ol</button>
        </div>
    </div>

    <div id="overlay" onclick="closeAll()"></div>

    <div class="top-bar">
        <button class="hamburger" onclick="toggleMenu('side-menu')">☰</button>
        <strong>MİRKAY AI🐺</strong>
        <button class="profile-btn" onclick="toggleMenu('profile-menu')">👤</button>
    </div>

    <div id="side-menu" class="side-panel">
        <div class="p-header">SOHBETLERİM <span onclick="closeAll()" style="cursor:pointer">×</span></div>
        <div id="summary-list"></div>
        <div style="padding: 15px; border-top: 1px solid #333;">
            <button class="btn-gold" style="background:red; color:white;" onclick="toggleDeleteMode()">SOHBETİ SİL</button>
        </div>
    </div>

    <div id="profile-menu" class="side-panel">
        <div class="p-header">PROFİL <span onclick="closeAll()" style="cursor:pointer">×</span></div>
        <div style="padding: 20px; text-align: center;">
            <div class="profile-circle" id="p-char">M</div>
            <p id="p-email" style="font-weight:bold; margin: 10px 0; word-break: break-all;"></p>
            <p id="p-status" style="color: #888; font-size: 14px;"></p>
            <hr>
            <button class="btn-gold" id="btn-premium" onclick="goPremium()">PREMIUM OL 🏆</button>
            <button class="btn-gold" style="background:#eee; color:#333;" onclick="logout()">Çıkış Yap</button>
            <button class="btn-gold" style="background:none; color:red; margin-top: 20px;" onclick="deleteAccount()">HESABI SİL</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <button class="hamburger" onclick="toggleAttach()" style="color:#333">📎</button>
        <div id="attach-menu">
            <button style="padding:15px; border:none; background:none; text-align:left; font-weight:bold;" onclick="handleMedia('camera')">📷 Fotoğraf Çek</button>
            <button style="padding:15px; border:none; background:none; text-align:left; font-weight:bold;" onclick="handleMedia('gallery')">🖼️ Fotoğraf Ekle</button>
            <button style="padding:15px; border:none; background:none; text-align:left; font-weight:bold; color:orange;" onclick="handleMedia('ai')">🎨 AI Fotoğraf Yap</button>
        </div>
        <form id="chat-form" onsubmit="event.preventDefault(); send();">
            <input type="text" id="user-input" placeholder="Mesajını yaz..." autocomplete="off">
            <button type="submit" style="background:none; border:none; font-size:24px; cursor:pointer;">🚀</button>
        </form>
    </div>

    <input type="file" id="file-input" style="display:none" onchange="processFile(this)">

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
