<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI | Nihai Sürüm 🐺</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: #f4f4f4; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #000; color: #fff; z-index: 1000; }
        .hamburger, .profile-btn { font-size: 26px; cursor: pointer; color: #fff; background: none; border: none; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 15px; margin: 8px 0; max-width: 80%; font-size: 15px; position: relative; transition: 0.3s; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: #fff; color: #333; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
        .msg img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; }
        .delete-box { position: absolute; left: -30px; top: 50%; transform: translateY(-50%); display: none; width: 22px; height: 22px; border: 2px solid red; cursor: pointer; border-radius: 4px; background: rgba(255,0,0,0.1); }
        .delete-mode .delete-box { display: block; }
        .input-wrapper { padding: 15px; background: #fff; border-top: 1px solid #eee; position: relative; }
        #chat-form { display: flex; align-items: center; gap: 10px; max-width: 800px; margin: 0 auto; }
        input[type="text"] { flex: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 30px; }
        .send-btn { width: 45px; height: 45px; background: #000; border: none; border-radius: 50%; color: #fff; cursor: pointer; }
        #attach-menu { position: absolute; bottom: 80px; left: 20px; background: #fff; border: 1px solid #ddd; border-radius: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); display: none; flex-direction: column; z-index: 1100; min-width: 220px; overflow: hidden; }
        #attach-menu.active { display: flex; }
        .attach-opt { padding: 15px; background: none; border: none; text-align: left; cursor: pointer; border-bottom: 1px solid #f9f9f9; font-weight: bold; }
        .side-panel { position: fixed; top: 0; width: 280px; height: 100%; transition: 0.4s; z-index: 2000; background: #fff; box-shadow: 0 0 25px rgba(0,0,0,0.2); }
        #side-menu { left: -300px; background: #111; color: #fff; }
        #side-menu.active { left: 0; }
        #profile-menu { right: -300px; }
        #profile-menu.active { right: 0; }
        .panel-header { padding: 25px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }
        .btn-action { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay" onclick="closeAll()"></div>
    <div class="top-bar">
        <button class="hamburger" onclick="toggleMenu('side-menu')">☰</button>
        <strong>MİRKAY AI 🐺</strong>
        <button class="profile-btn" onclick="toggleMenu('profile-menu')">👤</button>
    </div>

    <div id="side-menu" class="side-panel">
        <div class="panel-header">MENÜ <span onclick="closeAll()" style="cursor:pointer">×</span></div>
        <div style="padding:20px;">
            <button class="btn-action" onclick="sohbetOzetle()" style="background:#444; color:#fff;">📝 Sohbeti Özetle</button>
            <button class="btn-action" onclick="silmeModuAc()" style="background:red; color:#fff;">🗑️ Sohbeti Sil</button>
            <div id="ozet-alani" style="margin-top:20px; font-size:13px; color:#aaa; line-height:1.4;"></div>
        </div>
    </div>

    <div id="profile-menu" class="side-panel">
        <div class="panel-header">PROFİL <span onclick="closeAll()" style="cursor:pointer">×</span></div>
        <div style="padding:25px;">
            <p id="user-info" style="word-break: break-all;">E-posta: Bağlı Değil</p>
            <button class="btn-action" onclick="emailBagla()" style="background:#000; color:#fff;">📧 E-posta Bağla</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <div id="attach-menu">
            <button class="attach-opt" onclick="tetikle('camera')">📷 Fotoğraf Çek</button>
            <button class="attach-opt" onclick="tetikle('gallery')">🖼️ Fotoğraf Ekle</button>
            <button class="attach-opt" onclick="aiCizim()">🎨 AI Fotoğraf Yap</button>
        </div>
        <form id="chat-form" onsubmit="event.preventDefault(); gonder();">
            <button type="button" class="hamburger" onclick="toggleAttach()" style="color:#555">📎</button>
            <input type="file" id="cam-input" accept="image/*" capture="camera" style="display:none" onchange="dosyaSecildi(this)">
            <input type="file" id="gal-input" accept="image/*" style="display:none" onchange="dosyaSecildi(this)">
            <input type="text" id="user-input" placeholder="Bir şey yaz..." autocomplete="off">
            <button type="submit" class="send-btn">🚀</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
