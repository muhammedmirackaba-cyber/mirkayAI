<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirkay AI | Bozkurt</title>
    <style>
        body { margin: 0; background: #fff; font-family: sans-serif; overflow: hidden; }
        .wolf-bg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; opacity: 0.1; z-index: -1; }
        .top-bar { position: fixed; top: 0; width: 100%; height: 60px; display: flex; align-items: center; padding: 0 20px; background: #fff; border-bottom: 1px solid #eee; z-index: 1000; box-sizing: border-box; }
        .hamburger { font-size: 30px; cursor: pointer; margin-right: 20px; }
        #side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #000; color: #fff; transition: 0.3s; z-index: 1001; padding: 20px; box-sizing: border-box; }
        #side-menu.active { left: 0; }
        .menu-item { background: #222; padding: 12px; margin: 10px 0; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid #333; }
        .profile-btn { position: fixed; top: 15px; right: 20px; font-size: 25px; cursor: pointer; z-index: 1000; }
        #chat-container { height: 100vh; overflow-y: auto; padding: 80px 20px 100px; display: flex; flex-direction: column; box-sizing: border-box; }
        .msg { padding: 12px 18px; border-radius: 20px; margin: 5px; max-width: 70%; border: 1px solid #eee; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #f0f0f0; color: #000; }
        .ai-msg { align-self: flex-start; background: #000; color: #fff; }
        #input-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        button { padding: 12px 25px; background: #000; color: #fff; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        #auth-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-box { text-align: center; width: 300px; padding: 20px; }
        .hidden { display: none !important; }
        .btn-red { background: #ff4d4d; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray_wolf_head_silhouette.svg/1024px-Gray_wolf_head_silhouette.svg.png" class="wolf-bg">

    <div class="top-bar">
        <div class="hamburger" onclick="toggleSidebar()">☰</div>
        <strong>Mirkay AI</strong>
    </div>

    <div class="profile-btn" onclick="toggleSidebar()">👤</div>

    <div id="side-menu">
        <div style="font-size: 20px; margin-bottom: 20px; font-weight: bold;">Sohbet Geçmişi <span onclick="toggleSidebar()" style="float:right; cursor:pointer;">×</span></div>
        <div id="history-list"></div>
        <p id="display-status" style="font-size: 12px; color: #aaa; margin-top: 20px;"></p>
        <button class="btn-red" onclick="cikisYap()">Çıkış Yap</button>
    </div>

    <div id="auth-overlay" class="hidden">
        <div class="auth-box">
            <h2>Mirkay AI</h2>
            <p>Giriş yapın veya kayıt olun</p>
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-password" placeholder="Şifre">
            <button onclick="hizliKayit()" style="width:100%; margin-top:10px;">Devam Et</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Bir şeyler yaz...">
        <button onclick="mesajGonder()">Gönder</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
