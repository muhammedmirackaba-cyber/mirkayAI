<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MİRKAY AI - Bozkurt</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .bg { position: absolute; width: 100%; height: 100%; background: url('icon.png') center/contain no-repeat; opacity: 0.1; filter: blur(4px); z-index: -1; }
        
        /* Yuvarlak Modern Panel */
        .box { background: rgba(20, 20, 20, 0.95); padding: 30px; border-radius: 30px; box-shadow: 0 10px 40px rgba(255, 0, 0, 0.15); width: 350px; text-align: center; border: 1px solid #333; }
        
        h2 { letter-spacing: 2px; margin-bottom: 20px; font-size: 24px; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #111; border: 1px solid #444; border-radius: 20px; color: #fff; box-sizing: border-box; text-align: center; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        .btn-red { background: #ff0000; color: #fff; }
        .btn-social { background: #fff; color: #000; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-fb { background: #1877f2; color: #fff; }
        
        /* Chat Alanı */
        #chat-area { display: none; width: 90%; max-width: 500px; height: 80vh; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; background: rgba(10, 10, 10, 0.8); border-radius: 25px; padding: 20px; margin-bottom: 15px; border: 1px solid #222; }
        .limit-info { font-size: 12px; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="box" id="auth-screen">
        <h2>MİRKAY AI</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Şifre">
        <button class="btn btn-red" onclick="hizliKayit()">HIZLI KAYIT & GİRİŞ</button>
        <div style="margin: 15px 0; color: #555;">───── VEYA ─────</div>
        <button class="btn btn-social" onclick="googleGiris()">Google ile Bağlan</button>
        <button class="btn btn-social btn-fb" onclick="facebookGiris()">Facebook ile Bağlan</button>
    </div>

    <div id="chat-area">
        <div class="box" style="width: 100%; margin-bottom: 10px; padding: 15px;">
            <span id="user-display">Bozkurt</span> | <span id="limit-text">Kalan Hak: 50</span>
            <button onclick="logout()" style="float:right; background:none; border:none; color:red; cursor:pointer;">Çıkış</button>
        </div>
        <div id="messages"></div>
        <div class="box" style="width: 100%; padding: 15px;">
            <input type="text" id="msg-input" placeholder="Mesajınızı yazın..." style="margin-bottom: 5px;">
            <button class="btn btn-red" id="send-btn" onclick="mesajGonder()" style="margin:0;">GÖNDER</button>
            <div id="premium-link-area" style="margin-top: 10px; font-size: 12px; color: #aaa;">
                Sınırsız hak için <a href="#" onclick="showEmailLink()" style="color: #ff0000;">E-posta Bağla</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
