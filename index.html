<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI | Official</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .wolf-bg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; opacity: 0.1; z-index: 0; pointer-events: none; }
        
        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #eee; background: #fff; z-index: 1000; }
        .hamburger, .profile-btn { font-size: 26px; cursor: pointer; color: #000; padding: 5px; }

        .side-panel { position: fixed; top: 0; width: 280px; height: 100%; transition: 0.3s ease; z-index: 2000; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        #side-menu { left: -290px; background: #000; color: #fff; }
        #side-menu.active { left: 0; }
        #profile-menu { right: -290px; background: #fff; color: #000; border-left: 1px solid #eee; }
        #profile-menu.active { right: 0; }
        .panel-header { padding: 20px; font-weight: bold; border-bottom: 1px solid rgba(128,128,128,0.2); display: flex; justify-content: space-between; align-items: center; }

        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; z-index: 5; background: transparent; }
        .msg { padding: 12px 16px; border-radius: 18px; margin: 5px 0; max-width: 85%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; border-bottom-right-radius: 4px; }
        .ai-msg { align-self: flex-start; background: #f0f0f0; color: #333; border: 1px solid #eee; border-bottom-left-radius: 4px; }

        .input-wrapper { padding: 10px 15px 25px; background: #fff; border-top: 1px solid #eee; z-index: 1000; }
        #chat-form { display: flex; align-items: center; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .send-btn { width: 45px; height: 45px; background: #000; border: none; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .attach-btn { font-size: 24px; cursor: pointer; color: #666; padding: 5px; }
        
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1500; display: none; }
    </style>
</head>
<body>
    <div id="overlay" onclick="closeAllMenus()"></div>
    <img src="https://www.svgrepo.com/show/400511/wolf.svg" class="wolf-bg">
    
    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu('side-menu')">☰</div>
        <strong>MİRKAY AI</strong>
        <div class="profile-btn" onclick="toggleMenu('profile-menu')">👤</div>
    </div>

    <div id="side-menu" class="side-panel">
        <div class="panel-header">Menü <span onclick="closeAllMenus()" style="cursor:pointer">×</span></div>
        <div style="padding:15px; flex:1; display:flex; flex-direction:column; gap:10px;">
            <button onclick="location.reload()" style="width:100%; padding:12px; border:1px solid #fff; background:transparent; color:#fff; border-radius:8px; cursor:pointer;">+ Yeni Sohbet</button>
            <div style="margin-top:auto; padding-bottom:30px;">
                <a href="https://play.google.com/store/apps/details?id=com.muhammedmirackaba.mirkayai" target="_blank" style="text-decoration:none;">
                    <button style="width:100%; padding:15px; background:#27ae60; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">📥 Uygulamayı İndir</button>
                </a>
            </div>
        </div>
    </div>

    <div id="profile-menu" class="side-panel">
        <div class="panel-header">Profil <span onclick="closeAllMenus()" style="cursor:pointer">×</span></div>
        <div style="padding:20px; display:flex; flex-direction:column; gap:15px;">
            <div>
                <label style="font-size:11px; color:#666; text-transform:uppercase;">Hesap Durumu</label>
                <p id="user-email" style="margin:5px 0; font-weight:bold;">Yükleniyor...</p>
                <button onclick="emailBagla()" style="padding:8px; width:100%; cursor:pointer; background:#eee; border:none; border-radius:5px;">📧 E-Posta Bağla</button>
            </div>
            <hr style="border:0; border-top:1px solid #eee;">
            <div id="status-box">
                <p id="status-text" style="margin:0; font-weight:bold;">Yükleniyor...</p>
                <button id="premium-btn" onclick="premiumSatinal()" style="margin-top:10px; width:100%; padding:12px; background:#f1c40f; border:none; border-radius:5px; font-weight:bold; cursor:pointer; display:none;">💎 Premium Ol</button>
            </div>
            <button onclick="cikisYap()" style="margin-top:20px; color:red; border:none; background:none; cursor:pointer; font-weight:bold; text-align:left;">🚪 Çıkış Yap</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <form id="chat-form" onsubmit="event.preventDefault(); mesajGonder();">
            <label for="file-input" class="attach-btn">📎</label>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="resimSecildi(this)">
            <input type="text" id="user-input" placeholder="Mesaj yaz..." autocomplete="off">
            <button type="submit" class="send-btn">🚀</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
