<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirkay AI | Bozkurt</title>
    <style>
        body { margin: 0; background: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .wolf-bg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; opacity: 0.05; z-index: -1; }
        
        /* Üst Bar */
        .top-bar { position: fixed; top: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; border-bottom: 1px solid #eee; z-index: 1000; box-sizing: border-box; }
        .hamburger, .profile-btn { font-size: 24px; cursor: pointer; }

        /* Sol Menü (Geçmiş) */
        #side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #000; color: #fff; transition: 0.3s; z-index: 1001; padding: 20px; box-sizing: border-box; }
        #side-menu.active { left: 0; }
        .menu-item { background: #111; padding: 12px; margin: 10px 0; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid #222; transition: 0.2s; }
        .menu-item:hover { background: #222; }

        /* Sağ Menü (Profil/Hesap) */
        #profile-menu { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: #fff; border-left: 1px solid #eee; transition: 0.3s; z-index: 1001; padding: 20px; box-sizing: border-box; text-align: center; }
        #profile-menu.active { right: 0; }

        /* Sohbet Alanı */
        #chat-container { height: 100vh; overflow-y: auto; padding: 80px 20px 100px; display: flex; flex-direction: column; box-sizing: border-box; }
        .msg { padding: 12px 18px; border-radius: 20px; margin: 5px; max-width: 75%; border: 1px solid #eee; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background: #f0f0f0; color: #000; }
        .ai-msg { align-self: flex-start; background: #000; color: #fff; }

        /* Girişler ve Butonlar */
        #input-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        button { padding: 12px 20px; background: #000; color: #fff; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .btn-gold { background: #FFD700; color: #000; width: 100%; margin: 10px 0; }
        .btn-red { background: #ff4d4d; color: #fff; width: 100%; margin: 10px 0; }
        .btn-outline { background: #fff; color: #000; border: 1px solid #000; width: 100%; margin: 10px 0; }

        /* Auth Overlay */
        #auth-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-box { text-align: center; width: 300px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray_wolf_head_silhouette.svg/1024px-Gray_wolf_head_silhouette.svg.png" class="wolf-bg">

    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu('side-menu')">☰</div>
        <strong>Mirkay AI</strong>
        <div class="profile-btn" onclick="toggleMenu('profile-menu')">👤</div>
    </div>

    <div id="side-menu">
        <div style="font-size: 18px; margin-bottom: 20px; font-weight: bold;">Sohbet Geçmişi <span onclick="toggleMenu('side-menu')" style="float:right; cursor:pointer;">×</span></div>
        <div id="history-list"></div>
    </div>

    <div id="profile-menu">
        <div style="font-size: 18px; margin-bottom: 20px; font-weight: bold;">Hesabım <span onclick="toggleMenu('profile-menu')" style="float:right; cursor:pointer;">×</span></div>
        <p id="user-display-name" style="font-weight: bold;"></p>
        <p id="display-status" style="font-size: 13px; color: #666;"></p>
        <hr>
        <button class="btn-outline" onclick="emailBagla()">📧 E-posta Bağla</button>
        <button class="btn-gold" onclick="alert('Google Play üzerinden yakında!')">🏆 Premium Ol</button>
        <button class="btn-red" onclick="cikisYap()">🚪 Çıkış Yap</button>
    </div>

    <div id="auth-overlay" class="hidden">
        <div class="auth-box">
            <h2>Giriş Yap</h2>
            <input type="text" id="reg-username" placeholder="İsim">
            <input type="password" id="reg-password" placeholder="Şifre">
            <button onclick="hizliKayit()" style="width:100%; margin-top:10px;">Devam Et</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Bir şeyler yaz...">
        <button onclick="mesajGonder()">Gönder</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
