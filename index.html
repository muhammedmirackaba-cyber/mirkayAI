<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirkay AI | Bozkurt</title>
    <style>
        body { margin: 0; background: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* Arka Plan Bozkurt */
        .wolf-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; opacity: 0.1; z-index: -1;
        }

        /* Üst Bar ve Hamburger */
        .top-bar {
            position: fixed; top: 0; width: 100%; height: 60px;
            display: flex; align-items: center; padding: 0 20px; background: #fff;
            border-bottom: 1px solid #eee; z-index: 1000;
        }

        .hamburger { font-size: 30px; cursor: pointer; margin-right: 20px; }

        /* Sol Menü (Sohbet Geçmişi) */
        #side-menu {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: #000; color: #fff; transition: 0.3s; z-index: 1001; padding: 20px;
        }
        #side-menu.active { left: 0; }
        .menu-item { background: #222; padding: 10px; margin: 10px 0; border-radius: 8px; font-size: 14px; cursor: pointer; }

        /* Sağ Profil */
        .profile-btn { position: fixed; top: 15px; right: 20px; font-size: 25px; cursor: pointer; z-index: 1000; }

        /* Chat Alanı */
        #chat-container { height: 100vh; overflow-y: auto; padding: 80px 20px 100px; display: flex; flex-direction: column; }
        .msg { padding: 12px 18px; border-radius: 20px; margin: 5px; max-width: 70%; border: 1px solid #eee; }
        .user-msg { align-self: flex-end; background: #f0f0f0; }
        .ai-msg { align-self: flex-start; background: #000; color: #fff; }

        /* Input Alanı */
        #input-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        button { padding: 12px 25px; background: #000; color: #fff; border: none; border-radius: 25px; cursor: pointer; }

        /* Login Overlay */
        #auth-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #fff; z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        .auth-box { text-align: center; width: 300px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <img src="https://i.ibb.co/L6M0mPz/wolf.png" class="wolf-bg"> <div class="top-bar">
        <div class="hamburger" onclick="toggleSidebar()">☰</div>
        <strong>Mirkay AI</strong>
    </div>

    <div class="profile-btn" onclick="toggleProfile()">👤</div>

    <div id="side-menu">
        <div style="font-size: 20px; margin-bottom: 20px;">Sohbet Geçmişi <span onclick="toggleSidebar()" style="float:right; cursor:pointer;">×</span></div>
        <div id="history-list"></div>
        <button class="btn-red" onclick="cikisYap()" style="margin-top: 50px; background:red;">Çıkış Yap</button>
    </div>

    <div id="auth-overlay" class="hidden">
        <div class="auth-box">
            <img src="https://i.ibb.co/L6M0mPz/wolf.png" width="80" style="margin-bottom: 20px;">
            <h2>Giriş Yap</h2>
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-password" placeholder="Şifre">
            <button onclick="hizliKayit()" style="width:100%; margin-top:10px;">Devam Et</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Bir şeyler yaz...">
        <button onclick="mesajGonder()">Gönder</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
