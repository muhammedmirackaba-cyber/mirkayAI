<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirkay AI | Bozkurt Edition</title>
    <style>
        /* TEMEL TASARIM */
        body {
            margin: 0; padding: 0;
            background-color: #ffffff; /* BEYAZ ARKA PLAN */
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* ARKA PLANDAKİ SİYAH BOZKURT */
        .wolf-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; opacity: 0.1; z-index: -1; pointer-events: none;
        }

        /* PROFİL SİMGESİ */
        #profile-icon {
            position: fixed; top: 20px; right: 20px;
            width: 50px; height: 50px; border-radius: 50%;
            background: #000; cursor: pointer; border: 2px solid #333;
            z-index: 1000; display: flex; align-items: center; justify-content: center;
        }
        #profile-icon img { width: 30px; filter: invert(1); }

        /* YAN MENÜ */
        #side-menu {
            position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
            background: #fff; border-left: 3px solid #000;
            box-shadow: -10px 0 20px rgba(0,0,0,0.1);
            z-index: 1001; transition: 0.4s ease-in-out; padding: 50px 20px; text-align: center;
        }
        #side-menu.active { right: 0; }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 35px; cursor: pointer; }

        /* BUTONLAR VE GİRİŞLER */
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; }
        button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .btn-black { background: #000; color: #fff; }
        .btn-gold { background: #FFD700; color: #000; }
        .btn-red { background: #ff4d4d; color: #fff; }
        .hidden { display: none !important; }

        /* SOHBET ALANI */
        #chat-container { flex: 1; overflow-y: auto; padding: 80px 20px 100px; }
        .msg { margin: 10px; padding: 15px; border-radius: 15px; max-width: 80%; border: 1px solid #eee; }
        .user-msg { background: #f0f0f0; align-self: flex-end; margin-left: auto; color: #000; }
        .ai-msg { background: #000; color: #fff; align-self: flex-start; }

        /* ALT MESAJ KUTUSU */
        #input-area { position: fixed; bottom: 20px; width: 90%; max-width: 600px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray_wolf_head_silhouette.svg/1024px-Gray_wolf_head_silhouette.svg.png" class="wolf-bg">

    <div id="profile-icon" onclick="toggleMenu()">
        <img src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png">
    </div>

    <div id="side-menu">
        <span class="close-btn" onclick="toggleMenu()">&times;</span>
        <h2 id="display-username">Misafir</h2>
        <p id="display-status">Giriş Yapılmadı</p>
        <hr>
        <div id="auth-section">
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-password" placeholder="Şifre">
            <button class="btn-black" onclick="hizliKayit()">Kayıt Ol / Giriş Yap</button>
        </div>
        <div id="user-section" class="hidden">
            <button class="btn-black" onclick="emailBagla()">E-posta Bağla</button>
            <button class="btn-gold" onclick="alert('Uygulama yayına hazırlandığında bu buton aktif olacak!')">Premium Ol (100 TL)</button>
            <button class="btn-red" onclick="cikisYap()">Çıkış Yap</button>
        </div>
    </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Bir şeyler yaz...">
        <button class="btn-black" style="width: 80px;" onclick="mesajGonder()">Gönder</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
