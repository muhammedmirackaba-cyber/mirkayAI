<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mirkay AI</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Bozkurt Arka Plan - Tıklamayı engellememesi için z-index ve pointer-events düzeltildi */
        .wolf-bg { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 250px; opacity: 0.1; z-index: -1; pointer-events: none; 
            display: block !important;
        }
        
        /* Reklam Paneli (Modal) */
        #ad-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .ad-content { background: #fff; padding: 20px; border-radius: 15px; text-align: center; width: 100%; max-width: 300px; }

        .top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #eee; background: #fff; }
        .hamburger, .profile-btn { font-size: 24px; cursor: pointer; z-index: 1001; }

        /* Sohbet Alanı */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; z-index: 1; }
        .msg { padding: 12px 16px; border-radius: 18px; margin: 5px 0; max-width: 85%; font-size: 15px; }
        .user-msg { align-self: flex-end; background: #000; color: #fff; }
        .ai-msg { align-self: flex-start; background: #f0f0f0; border: 1px solid #eee; }
        .limit-msg { align-self: center; background: #fff3f3; color: #d32f2f; border: 1px solid #ffcdd2; text-align: center; font-weight: bold; width: 90%; }

        /* Giriş Formu */
        .input-wrapper { padding: 10px 15px 25px; background: #fff; border-top: 1px solid #eee; z-index: 10; }
        #chat-form { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; font-size: 16px; outline: none; }
        .send-btn { width: 45px; height: 45px; background: #000; color: #fff; border: none; border-radius: 50%; cursor: pointer; }

        /* Yan Menüler */
        .side-panel { position: fixed; top: 0; width: 280px; height: 100%; background: #000; color: #fff; transition: 0.3s; z-index: 2000; }
        #side-menu { left: -280px; }
        #side-menu.active { left: 0; }
        #profile-menu { right: -280px; background: #fff; color: #000; border-left: 1px solid #eee; padding: 20px; }
        #profile-menu.active { right: 0; }
        .btn-m { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Gray_wolf_head_silhouette.svg/1024px-Gray_wolf_head_silhouette.svg.png" class="wolf-bg">

    <div id="ad-modal">
        <div class="ad-content">
            <h2 style="color:#000">🐺 Mirkay AI</h2>
            <p>Premium alarak reklamları kaldırabilir ve sınırsız mesaj hakkına sahip olabilirsiniz!</p>
            <button class="btn-m" style="background:#FFD700" onclick="alert('Ödeme Sistemi Yakında!')">Premium'a Geç</button>
            <button class="btn-m" style="background:#eee" onclick="reklamKapat()">Reklamı Kapat (5s)</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu('side-menu')">☰</div>
        <strong>MİRKAY AI</strong>
        <div class="profile-btn" onclick="toggleMenu('profile-menu')">👤</div>
    </div>

    <div id="side-menu" class="side-panel">
        <div style="padding:20px; border-bottom:1px solid #333;">Geçmiş</div>
        <div style="padding:10px;"><button class="btn-m" style="background:#fff" onclick="yeniSohbet()">+ Yeni Sohbet</button></div>
    </div>

    <div id="profile-menu" class="side-panel">
        <h3>Profilim</h3>
        <p id="status-info" style="font-size:14px; color:#666"></p>
        <button class="btn-m" style="background:#ff4d4d; color:#fff" onclick="location.reload()">Çıkış Yap</button>
    </div>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <form id="chat-form" onsubmit="event.preventDefault(); mesajGonder();">
            <input type="text" id="user-input" placeholder="Mesaj yaz..." autocomplete="off">
            <button type="submit" class="send-btn">🚀</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
