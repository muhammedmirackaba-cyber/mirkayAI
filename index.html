<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozkurt AI - Chat</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: #e3e3e3; font-family: 'Google Sans', sans-serif; display: flex; height: 100vh; }
        
        .bg-img { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('icon.png') center/contain no-repeat; opacity: 0.05; z-index: -1; }

        /* --- YAN PANEL (Sidebar) --- */
        .sidebar { width: 260px; background: #131314; display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #333; }
        .new-chat { background: #1a1a1c; border: 1px solid #444; border-radius: 50px; padding: 12px; color: #fff; cursor: pointer; text-align: center; margin-bottom: 20px; transition: 0.3s; }
        .new-chat:hover { background: #333; }
        .chat-history { flex: 1; overflow-y: auto; font-size: 14px; }
        .history-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-item:hover { background: #2e2e2e; }

        /* --- ANA CHAT ALANI --- */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; color: #ff0000; }
        
        #messages { flex: 1; overflow-y: auto; padding: 40px 15% 100px 15%; display: flex; flex-direction: column; gap: 25px; }
        .message { max-width: 80%; line-height: 1.6; }
        .user-msg { align-self: flex-end; background: #2b2b2b; padding: 12px 20px; border-radius: 20px; color: #fff; }
        .ai-msg { align-self: flex-start; color: #e3e3e3; }

        /* --- YAZI YAZMA YERİ (Alt Kısım) --- */
        .input-area { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 70%; max-width: 800px; }
        .input-container { background: #1e1e1f; border-radius: 30px; padding: 10px 20px; display: flex; align-items: center; border: 1px solid #444; }
        input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; padding: 10px; outline: none; }
        .send-btn { background: none; border: none; color: #ff0000; cursor: pointer; font-size: 20px; padding-left: 15px; }

        /* --- GİRİŞ EKRANI (OVERLAY) --- */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #131314; padding: 40px; border-radius: 25px; text-align: center; width: 350px; border: 1px solid #333; }
        .login-box input { background: #1e1e1f; border: 1px solid #444; width: 100%; margin-bottom: 10px; border-radius: 12px; }
        .btn-red { background: #ff0000; color: #fff; width: 100%; padding: 12px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="bg-img"></div>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color:red; letter-spacing:3px;">MİRKAY AI</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button class="btn-red" onclick="hizliGiris()">Hızlı Giriş Yap</button>
            <p style="font-size: 11px; color: #555; margin-top: 10px;">Google/Facebook Yakında...</p>
        </div>
    </div>

    <div class="sidebar">
        <div class="new-chat" onclick="location.reload()">+ Yeni Sohbet</div>
        <div class="chat-history" id="history">
            <div class="history-item">Dün: Bozkurt Kodları</div>
            <div class="history-item">Hafta: Oyun Projem</div>
        </div>
        <div style="font-size: 12px; color: #555;">Kalan Hak: <span id="limit-show">50</span></div>
    </div>

    <div class="main-content">
        <div class="header">
            <span>MİRKAY AI <small style="color:#555; font-size:10px;">v3.0</small></span>
            <button onclick="cikis()" style="background:none; border:none; color:#555; cursor:pointer;">Çıkış Yap</button>
        </div>

        <div id="messages">
            <div class="ai-msg message">Sana nasıl yardımcı olabilirim Bozkurt?</div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Buraya bir soru yazın...">
                <button class="send-btn" onclick="gonder()">➤</button>
            </div>
            <div style="text-align:center; font-size:11px; color:#555; margin-top:10px;">
                Premium alarak sınırsız yazabilir ve e-posta bağlayabilirsin.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
